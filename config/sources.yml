# Cyber Risk Pulse - source endpoint configuration
#
# All upstream URLs live here so that an endpoint change is a one-line edit
# rather than a code change. Verified against official documentation on
# 2026-07-23; re-verify before relying on production ingestion (see
# docs/source_licences.md).

cisa_kev:
  name: "CISA Known Exploited Vulnerabilities"
  catalog_page: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
  feed_json: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
  feed_csv: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.csv"
  # Reject an ingestion run that returns fewer than this many KEV rows.
  min_expected_rows: 500

nvd:
  name: "NIST National Vulnerability Database CVE API 2.0"
  docs: "https://nvd.nist.gov/developers/vulnerabilities"
  cve_api: "https://services.nvd.nist.gov/rest/json/cves/2.0"
  # NVD default page size. A single request may not exceed 2000.
  results_per_page: 2000
  # A single lastMod date-range request may not span more than 120 days.
  max_range_days: 120
  # Rolling window of CVEs to retrieve (published or modified within N days).
  rolling_window_days: 30
  # Polite request spacing (seconds). NVD's keyed limit is 50 requests per
  # rolling 30s == 0.6s each: sitting exactly on that boundary triggers 429s,
  # each of which then costs retry backoff. 1.0s (30 per 30s) stays safely
  # under it. Without a key NVD recommends >=6s.
  request_delay_seconds_no_key: 6.0
  request_delay_seconds_with_key: 1.0
  # KEV CVEs outside the rolling window are enriched with per-CVE NVD lookups
  # to attach CVSS/CPE detail. NVD has no bulk cveId endpoint, so this is one
  # request each - bound it so runs stay fast. Older KEV entries still appear
  # (synthesised from the KEV feed, which carries vendor/product) and are P1
  # regardless of CVSS, so nothing critical is lost when enrichment is capped.
  # Only enrich KEV added within this many days:
  enrich_max_age_days: 120
  # ...never issue more than this many enrichment lookups per run:
  enrich_max_count: 0
  # ...and stop enriching once this wall-clock budget (seconds) is spent, so a
  # slow or throttled NVD can never stall the whole deploy. Set to 0 to disable
  # enrichment entirely (older KEV then shows KEV-only detail).
  enrich_time_budget_seconds: 90

epss:
  name: "FIRST Exploit Prediction Scoring System"
  docs: "https://www.first.org/epss/api"
  api: "https://api.first.org/data/v1/epss"
  # CVEs per comma-separated batch request.
  batch_size: 100
  # Historical scores available from this date per official docs.
  history_start: "2021-04-14"

http:
  # Shared HTTP behaviour for all adapters.
  timeout_seconds: 30
  # Keep retry cost low: a persistently rate-limited request must fail fast, not
  # burn ~30s of backoff. 2 retries with a 15s ceiling => <=6s wasted per dead
  # request (2s + 4s), so a throttling episode can't run the job for an hour.
  max_retries: 2
  backoff_base_seconds: 2.0
  backoff_max_seconds: 15.0
  user_agent: "cyber-risk-pulse/0.1.0 (+https://github.com/OWNER/cyber-risk-pulse)"
