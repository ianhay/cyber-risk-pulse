name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install -e ".[dev]"
      - name: Run pytest
        run: python -m pytest -q
      - name: Build data from fixtures (offline)
        run: python scripts/build_fixture_site.py
      - name: Validate generated site data
        run: |
          pip install jsonschema
          python scripts/validate_site.py

  frontend:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Rebuild fixture data for the bundle
        run: |
          python -m pip install -e .
          npm run data:fixture
      - name: Production build
        run: npm run build
